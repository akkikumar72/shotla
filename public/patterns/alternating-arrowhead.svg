<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 80 80">
  <defs>
    <pattern id="alternating-arrowhead" x="0" y="0" width="80" height="80" patternUnits="userSpaceOnUse">
      <rect width="80" height="80" fill="#1e293b"/>
      <g stroke="#10b981" stroke-width="2" fill="none" opacity="0.8">
        <!-- Upward arrows -->
        <path d="M20 60 L40 20 L60 60"/>
        <path d="M-20 60 L0 20 L20 60"/>
        <path d="M60 60 L80 20 L100 60"/>
        <!-- Downward arrows offset -->
        <path d="M0 20 L20 60 L40 20"/>
        <path d="M40 20 L60 60 L80 20"/>
        <path d="M-40 20 L-20 60 L0 20"/>
        <path d="M80 20 L100 60 L120 20"/>
      </g>
      <g stroke="#3b82f6" stroke-width="1.5" fill="none" opacity="0.5">
        <!-- Secondary layer -->
        <path d="M10 70 L30 30 L50 70"/>
        <path d="M50 70 L70 30 L90 70"/>
        <path d="M-10 70 L10 30 L30 70"/>
        <path d="M70 70 L90 30 L110 70"/>
        <!-- Connecting lines -->
        <path d="M30 30 L50 30"/>
        <path d="M10 30 L30 30"/>
        <path d="M50 30 L70 30"/>
      </g>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#alternating-arrowhead)"/>
</svg>
