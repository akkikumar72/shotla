<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <defs>
    <pattern id="bermuda-circle" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="#0f172a"/>
      <g stroke="#14b8a6" stroke-width="2" fill="none" opacity="0.7">
        <!-- Main circles -->
        <circle cx="25" cy="25" r="20"/>
        <circle cx="75" cy="25" r="20"/>
        <circle cx="25" cy="75" r="20"/>
        <circle cx="75" cy="75" r="20"/>
        <!-- Center intersection -->
        <circle cx="50" cy="50" r="15"/>
      </g>
      <g stroke="#06b6d4" stroke-width="1" fill="none" opacity="0.5">
        <!-- Secondary layer -->
        <circle cx="0" cy="0" r="15"/>
        <circle cx="100" cy="0" r="15"/>
        <circle cx="0" cy="100" r="15"/>
        <circle cx="100" cy="100" r="15"/>
        <!-- Small accent circles -->
        <circle cx="12.5" cy="50" r="8"/>
        <circle cx="87.5" cy="50" r="8"/>
        <circle cx="50" cy="12.5" r="8"/>
        <circle cx="50" cy="87.5" r="8"/>
      </g>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#bermuda-circle)"/>
</svg>
