<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 80 80">
  <defs>
    <pattern id="bermuda-diamond" x="0" y="0" width="80" height="80" patternUnits="userSpaceOnUse">
      <rect width="80" height="80" fill="#1e293b"/>
      <g stroke="#a855f7" stroke-width="2" fill="none" opacity="0.7">
        <!-- Main diamonds -->
        <path d="M40 10 L60 40 L40 70 L20 40 Z"/>
        <path d="M80 50 L100 80 L80 110 L60 80 Z"/>
        <path d="M0 50 L20 80 L0 110 L-20 80 Z"/>
        <path d="M40 -30 L60 0 L40 30 L20 0 Z"/>
      </g>
      <g stroke="#ec4899" stroke-width="1.5" fill="none" opacity="0.5">
        <!-- Secondary diamonds -->
        <path d="M20 25 L35 40 L20 55 L5 40 Z"/>
        <path d="M60 25 L75 40 L60 55 L45 40 Z"/>
        <path d="M40 65 L55 80 L40 95 L25 80 Z"/>
        <path d="M40 -15 L55 0 L40 15 L25 0 Z"/>
