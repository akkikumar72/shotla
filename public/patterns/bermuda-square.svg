<svg xmlns="http://www.w3.org/2000/svg" width="90" height="90" viewBox="0 0 90 90">
  <defs>
    <pattern id="bermuda-square" x="0" y="0" width="90" height="90" patternUnits="userSpaceOnUse">
      <rect width="90" height="90" fill="#1e293b"/>
      <g stroke="#6366f1" stroke-width="2" fill="none" opacity="0.7">
        <!-- Main squares -->
        <rect x="20" y="20" width="25" height="25"/>
        <rect x="45" y="45" width="25" height="25"/>
        <rect x="-5" y="45" width="25" height="25"/>
        <rect x="45" y="-5" width="25" height="25"/>
      </g>
      <g stroke="#8b5cf6" stroke-width="1.5" fill="none" opacity="0.5">
        <!-- Secondary squares -->
        <rect x="10" y="10" width="15" height="15"/>
        <rect x="35" y="35" width="15" height="15"/>
        <rect x="60" y="60" width="15" height="15"/>
        <rect x="35" y="10" width="15" height="15"/>
        <rect x="10" y="35" width="15" height="15"/>
        <!-- Grid lines -->
        <path d="M0 32.5 L90 32.5"/>
        <path d="M32.5 0 L32.5 90"/>
        <path d="M57.5 0 L57.5 90"/>
        <path d="M0 57.5 L90 57.5"/>
      </g>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#bermuda-square)"/>
</svg>
