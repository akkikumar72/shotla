<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <defs>
    <pattern id="confetti-doodles" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="#1e293b"/>
      <g stroke="#ec4899" stroke-width="1.5" fill="none" opacity="0.8">
        <!-- Confetti pieces -->
        <circle cx="20" cy="20" r="3"/>
        <circle cx="80" cy="30" r="2"/>
        <circle cx="30" cy="70" r="2.5"/>
        <circle cx="70" cy="80" r="3"/>
        <rect x="40" y="15" width="4" height="4" transform="rotate(45 42 17)"/>
        <rect x="15" y="55" width="3" height="3" transform="rotate(30 16.5 56.5)"/>
        <rect x="85" y="65" width="3" height="3" transform="rotate(60 86.5 66.5)"/>
      </g>
      <g stroke="#f472b6" stroke-width="1" fill="none" opacity="0.6">
        <!-- Squiggly lines -->
        <path d="M10 40 Q15 35 20 40 Q25 45 30 40"/>
        <path d="M50 60 Q55 55 60 60 Q65 65 70 60"/>
        <path d="M75 15 Q80 10 85 15 Q90 20 95 15"/>
        <path d="M5 85 Q10 80 15 85 Q20 90 25 85"/>
        <!-- Zigzag lines -->
        <path d="M35 25 L40 30 L45 25 L50 30"/>
        <path d="M60 75 L65 80 L70 75 L75 80"/>
        <path d="M25 50 L30 55 L35 50 L40 55"/>
      </g>
      <g stroke="#fbbf24" stroke-width="0.5" fill="none" opacity="0.4">
        <!-- Small dots -->
        <circle cx="55" cy="25" r="1"/>
        <circle cx="25" cy="35" r="1"/>
        <circle cx="75" cy="45" r="1"/>
        <circle cx="45" cy="85" r="1"/>
        <circle cx="65" cy="40" r="1"/>
        <circle cx="35" cy="90" r="1"/>
        <circle cx="85" cy="85" r="1"/>
        <circle cx="15" cy="75" r="1"/>
      </g>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#confetti-doodles)"/>
</svg>
