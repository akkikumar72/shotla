<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <defs>
    <pattern id="geometric-intersection" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="#1e293b"/>
      <g stroke="#64748b" stroke-width="2" fill="none" opacity="0.7">
        <!-- Intersecting rectangles -->
        <rect x="10" y="30" width="40" height="20"/>
        <rect x="30" y="10" width="20" height="40"/>
        <rect x="50" y="50" width="40" height="20"/>
        <rect x="70" y="30" width="20" height="40"/>
        <!-- Diagonal intersections -->
        <path d="M20 70 L40 70 L50 80 L50 100 L30 100 L20 90 Z"/>
        <path d="M70 10 L90 10 L100 20 L100 40 L80 40 L70 30 Z"/>
      </g>
      <g stroke="#94a3b8" stroke-width="1.5" fill="none" opacity="0.5">
        <!-- Secondary intersections -->
        <circle cx="25" cy="25" r="12"/>
        <circle cx="75" cy="75" r="12"/>
        <path d="M15 50 L35 50 L25 65 Z"/>
        <path d="M85 35 L85 55 L70 45 Z"/>
        <!-- Grid lines -->
        <path d="M0 50 L100 50"/>
        <path d="M50 0 L50 100"/>
        <path d="M25 0 L25 100"/>
        <path d="M75 0 L75 100"/>
        <path d="M0 25 L100 25"/>
        <path d="M0 75 L100 75"/>
      </g>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#geometric-intersection)"/>
</svg>
